name: Daily Card Betting Tips

on:
  schedule:
    - cron: '0 9 * * *'   # 09:00 UTC daily (10:00 BST / 11:00 CEST)
  workflow_dispatch:        # Manual trigger from GitHub Actions UI

jobs:
  generate-tips:
    runs-on: ubuntu-latest

    permissions:
      contents: write       # Needed to commit the generated file

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install anthropic requests

      - name: Generate tips
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
          SLACK_BOT_TOKEN:   ${{ secrets.SLACK_BOT_TOKEN }}
          SERPER_API_KEY:    ${{ secrets.SERPER_API_KEY }}
        run: python scripts/generate_tips.py

      - name: Commit updated HTML to main branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add card-betting-tips.html
          git diff --staged --quiet || git commit -m "Daily card betting tips update [skip ci]"
          git push
